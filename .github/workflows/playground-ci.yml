name: Playground CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Audit UX contract
        run: pnpm run audit:ux

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

  notify-workspace:
    name: Notify workspace after validated main CI
    needs: [quality]
    if: >-
      ${{
        needs.quality.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validated submodule revision to workspace
        uses: actions/github-script@v7
        env:
          WORKSPACE_DISPATCH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.WORKSPACE_DISPATCH_TOKEN || github.token }}
          script: |
            if (!process.env.WORKSPACE_DISPATCH_TOKEN) {
              core.setFailed('WORKSPACE_DISPATCH_TOKEN is not configured');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'relgeo',
              repo: 'workspace',
              event_type: 'submodule_ci_succeeded',
              client_payload: {
                submodule: 'playground',
                repository: 'relgeo/playground',
                path: 'playground',
                sha: context.sha,
                run_id: String(context.runId),
                run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                workflow: '.github/workflows/playground-ci.yml',
                branch: context.ref,
              },
            });
