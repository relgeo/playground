version: "0.5"

scene:
  unit: mm
  autoSize: true
  padding: 25

parameters:
  wave_count: { default: 12, min: 3, max: 24, step: 1, label: "Block Count" }
  arrow_count: { default: 8, min: 2, max: 16, step: 1, label: "Arrow Count" }

constants:
  start_x: 0
  start_y: 50
  mid_x: 60
  mid_y: 10
  end_x: 120
  end_y: 50

objects:
  # ─── APPROACH 1: Direct Linear Repeat with frameAt (Quadratic Curve) ───
  
  curve_quad:
    type: quadratic
    from: ["start_x", "start_y"]
    cp: ["mid_x", "mid_y"]
    to: ["end_x", "end_y"]
    meta:
      stroke: "#94a3b8"
      width: 1
      dash: "3 3"
      fill: none

  oriented_blocks:
    type: repeat
    count: "wave_count"
    item:
      type: rect
      size: [6, 3]
      on:
        # Places the rectangle center at parameter t,
        # and automatically rotates it along the curve!
        frame:
          path: curve_quad
          t: "index / (count - 1)"
      meta:
        fill: "#e0f2fe"
        stroke: "#0284c7"
        width: 1.2

  # ─── APPROACH 2: Divide Collection + Oriented frameAt (Cubic Curve) ───
  
  curve_cubic:
    type: cubic
    from: [0, 80]
    cp1: [40, 60]
    cp2: [80, 100]
    to: [120, 80]
    meta:
      stroke: "#cbd5e1"
      width: 1
      fill: none

  cubic_marks:
    type: divide
    target: curve_cubic
    count: "arrow_count"

  oriented_arrows:
    type: repeat
    each: cubic_marks
    item:
      type: polygon
      points:
        - [0, 0]
        - [-5, -2.5]
        - [-5, 2.5]
      on:
        # Coordinates from the divide marks,
        # rotation angle from the original cubic curve frameAt
        frame:
          path: curve_cubic
          t: "index / (count - 1)"
      meta:
        fill: "#fee2e2"
        stroke: "#ef4444"
        width: 1

  # ─── APPROACH 3: Uniform Spacing with tAtLength (Cubic Curve) ───

  curve_uniform:
    type: cubic
    from: [0, 135]
    cp1: [35, 105]
    cp2: [85, 165]
    to: [120, 135]
    meta:
      stroke: "#cbd5e1"
      width: 1
      fill: none
      dash: "2 2"

  uniform_blocks:
    type: repeat
    count: "wave_count"
    item:
      type: rect
      size: [6, 3]
      on:
        # Uniform spacing calculated by dividing the physical length,
        # then converting that physical distance back to t parametrik via tAtLength!
        frame:
          path: curve_uniform
          t: "tAtLength(curve_uniform, (index / (count - 1)) * length(curve_uniform))"
      meta:
        fill: "#ccfbf1"
        stroke: "#0d9488"
        width: 1.2

  # Annotations
  label_quad:
    type: annotation
    text: "Approach 1: Direct Parametric Repeat (Parametric Spacing)"
    target: oriented_blocks
    leader:
      from: [60, 30]
      to: [60, 18]
    meta:
      fontSize: 4.5
      stroke: "#0284c7"

  label_cubic:
    type: annotation
    text: "Approach 2: Divide Collection + Oriented frameAt"
    target: oriented_arrows
    leader:
      from: [60, 90]
      to: [60, 102]
    meta:
      fontSize: 4.5
      stroke: "#ef4444"

  label_uniform:
    type: annotation
    text: "Approach 3: Perfect Uniform Physical Spacing via tAtLength()"
    target: uniform_blocks
    leader:
      from: [60, 145]
      to: [60, 155]
    meta:
      fontSize: 4.5
      stroke: "#0d9488"

  # Title
  main_title:
    type: text
    content: "Oriented Patterns — Repeat Along Parametric Paths"
    at: [60, -8]
    anchor: topCenter
    meta:
      fontSize: 7
      fill: "#1e293b"
