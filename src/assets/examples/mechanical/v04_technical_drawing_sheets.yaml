version: 0.5
meta:
  name: Technical Drawing with Sheets
  description: Example of using active Sheets and Views for professional technical drawing layouts, including ellipse features in a bracket face.
  version: BRKT-2026.07
  date: "2026-07-13"

scene:
  unit: mm
  # Note: When sheets are defined, the renderer will target them instead of the raw scene.

components:
  bracket:
    parameters:
      width: { default: 60 }
      height: { default: 40 }
      thickness: { default: 10 }
    objects:
      # Front View Profile
      front_profile:
        type: rect
        size: ["width", "height"]
        corner: { radius: 5 }
        meta: { fill: "#f1f5f9", stroke: "#1e293b", width: 1.5, role: "front" }
      
      hole_front:
        type: circle
        radius: 6
        center: ["width/2", "height/2"]
        meta: { fill: "white", stroke: "#1e293b", width: 1, role: "front" }

      slot_front:
        type: ellipse
        center: ["width * 0.72", "height/2"]
        size: [16, 8]
        rotation: 0.25
        meta: { fill: "white", stroke: "#1e293b", width: 1, role: "front" }

      # Side View Profile (Thickness)
      side_profile:
        type: rect
        size: ["thickness", "height"]
        place: { left: front_profile.right + 20, top: front_profile.top }
        meta: { fill: "#f8fafc", stroke: "#1e293b", width: 1.5, role: "side" }
      
      hole_side:
        type: line
        from: [side_profile.left, front_profile.centerY]
        to: [side_profile.right, front_profile.centerY]
        meta: { stroke: "#94a3b8", dash: "4 2", width: 0.5, role: "side" }

      # Dimensions (Front)
      dim_w:
        type: dimension
        kind: linear
        from: front_profile.topLeft
        to: front_profile.topRight
        offset: -10
        meta: { fontSize: 4, role: "front" }
      
      dim_hole:
        type: dimension
        kind: diameter
        target: hole_front
        meta: { fontSize: 4, role: "front" }

      note_slot:
        type: annotation
        target: slot_front
        text: "Inspection slot"
        place:
          left: slot_front.right + 10
          centerY: slot_front.centerY
        meta: { fontSize: 4, role: "front", stroke: "#475569" }

      # Dimensions (Side)
      dim_thk:
        type: dimension
        kind: linear
        from: side_profile.bottomLeft
        to: side_profile.bottomRight
        offset: 10
        meta: { fontSize: 4, role: "side" }

    exports:
      center: front_profile.center

objects:
  # Instantiate the bracket in the scene workspace
  main_part:
    type: component
    use: bracket

# Define isolated views filtering by role
views:
  front_view:
    target: main_part
    scale: 1
    filter:
      roles: ["front"]
  
  side_view:
    target: main_part
    scale: 1
    filter:
      roles: ["side"]
  
  detail_view:
    target: main_part
    scale: 2 # 2x zoomed in
    filter:
      roles: ["front"]

# Layout the views on a professional drawing sheet
sheets:
  # ISO A4 Landscape (297 x 210 mm)
  "A4-01":
    size: [297, 210]
    orientation: landscape
    meta:
      title: Bracket Assembly Sheet
      sheetSize: A4 Landscape
    views:
      - use: front_view
        place:
          topLeft: [30, 40]
      
      - use: side_view
        place:
          topLeft: [120, 40]
      
      - use: detail_view
        place:
          topLeft: [180, 40]

  "A4-02":
    size: [297, 210]
    orientation: landscape
    meta:
      title: Bracket Detail Sheet
      version: BRKT-DET-02
      date: "2026-07-14"
      sheetSize: A4 Landscape
    views:
      - use: front_view
        place:
          topLeft: [35, 55]

      - use: detail_view
        place:
          topLeft: [170, 50]
